apiVersion: v1
kind: Service
metadata:
  name: &app-name svc-go-authorizer-v2
  namespace: test-a
  labels:
    app: *app-name
spec:
  type: ClusterIP
  ports:
  - port: 7100
    targetPort: 7100
    protocol: TCP
    name: http
  - port: 8100
    targetPort: 8100
    protocol: TCP
    name: metrics
  selector:
    app: go-authorizer-v2