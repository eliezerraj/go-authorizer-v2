apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ec256-keys
  namespace: test-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sa-go-authorizer-v2
    kind: SecretStore
  target:
    name: ec256-keys
    creationPolicy: Owner
  data:
    - secretKey: ec256_private_key
      remoteRef:
        key: ec256_private_key
        property: ec256_private_key
    - secretKey: ec256_public_key
      remoteRef:
        key: ec256_public_key
        property: ec256_public_key

