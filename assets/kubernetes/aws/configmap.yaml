apiVersion: v1
kind: ConfigMap
metadata:
  name: &app-name cm-go-authorizer-v2
  namespace: test-a
  labels:
    app: *app-name
data:
  APP_NAME: "go-authorizer-v2.eks-01-02"
  VERSION: "1.0"
  ACCOUNT: "aws:908671954593"
  ENV: "dev"
  TYPE: "webserver"

  HTTP_TIMEOUT: "120s"
  HTTP_KEEP_ALIVE: "120s"
  HTTP_READTIMEOUT: "120s"
  HTTP_WRITETIMEOUT: "120s"
  HTTP_IDLECONNTIMEOUT: "120s"
  HTTP_MAXIDLECONNS: "2"
  HTTP_MAXIDLECONNSPERHOST: "2"
  HTTP_MAXCONNSPERHOST: "2"
  HTTP_PORT: "7100"
  READ_BUFFER_SIZE: "12288"
  DISABLE_STARTUP_MESSAGE: "true"

  RSA_PRIVATE_KEY_PATH: "/var/keys/rsa_private_key.pem"
  RSA_PUBLIC_KEY_PATH: "/var/keys/rsa_public_key.pem"
  TOKEN_TTL: "172800s"
  CURRENT_KID: "go-authorizer-v2-key-2026-09"

  EC256_PUBLIC_KEY_PATH: "/var/keys/ec256_public_key.pem"
  EC256_KID: "go-authorizer-v2-ec256-key-2026-09"

  DB_HOST: "rds-proxy-db-arch.proxy-couoacqalfwt.us-east-2.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
  DB_NAME: "postgres"
  DB_SCHEMA: "public"
  DATABASE_QUERY_TRACER: "false"
  DB_MAX_CONNS: "5" 
  DB_MIN_CONNS: "5" 
  DB_CONNECTION_TIMEOUT_DURATION: "4s"
  DB_LIFE_TIME_CONNS: "28s"
  DB_IDLE_TIME_CONNS: "1s"

  LOG_LEVEL: "info" #info, error, warning
  LOG_MODE: "json"

  OTEL_EXPORTER_OTLP_ENDPOINT: "arch-eks-01-02-otel-collector.default.svc.cluster.local:4317"
  OTEL_METRICS_PORT: "8100"
